<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>资料管理系统 · UI 设计预览 V0.1</title>
<style>
:root{--ink:#273747;--muted:#8995a3;--line:#e7ebef;--bg:#f5f7fa;--primary:#247982;--pale:#e9f4f3;--shadow:0 5px 24px #27374709}
*{box-sizing:border-box}body{margin:0;font:14px/1.6 "Microsoft YaHei UI","Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
button,input,select{font:inherit}button{border:0;cursor:pointer;background:none;color:inherit}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--primary);outline-offset:2px}

.brand{display:flex;gap:11px;align-items:center;padding:2px 12px 24px;border-bottom:1px solid var(--line);margin-bottom:21px}.logo{display:grid;place-items:center;width:36px;height:36px;border-radius:10px;background:var(--primary);color:#fff;font-size:16px;font-weight:800;letter-spacing:-1px}.brand b{display:block;letter-spacing:.2px;font-size:18px;line-height:1.1}.brand small{font-size:10px;color:#99a4b0}

.main{min-width:0;flex:1;display:flex;flex-direction:column}.top{height:66px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:18px;padding:0 32px;flex:none}.workspace{display:flex;align-items:center;gap:8px;border:1px solid var(--line);padding:7px 13px;border-radius:8px;font-weight:700;background:#fff}.workspace:hover{background:var(--pale)}.searchglobal{margin-left:auto;min-width:190px;display:flex;align-items:center;gap:10px;padding:7px 13px;border-radius:8px;background:#f5f7f9;color:#9aa5af;font-size:12px}.searchglobal input{border:0;background:transparent;outline:none;min-width:80px;width:210px}.topbadge{font-size:11px;background:#eef6f2;color:#4e9074;padding:5px 11px;border-radius:20px;white-space:nowrap}.topbutton{border:1px solid var(--line);padding:7px 13px;border-radius:8px}
.content{overflow:auto;flex:1;padding:29px 35px 46px}.breadcrumb{color:#a0aab3;font-size:12px;margin-bottom:10px}.heading{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:23px}.heading h1{font-size:24px;font-weight:700;letter-spacing:-.5px;margin:0 0 4px}.subtitle{font-size:13px;color:var(--muted)}.actions{display:flex;gap:9px;align-items:center}.btn{border:1px solid #dfe5ea;background:#fff;border-radius:7px;padding:8px 15px;white-space:nowrap}.btn:hover{background:#f5faf9;border-color:#a4ccd0}.primary{background:var(--primary);color:#fff;border-color:var(--primary)}.primary:hover{background:#175e65;color:#fff}.danger{color:#c14f55}
.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:24px}.card{background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:21px}.metriclabel{font-size:13px;color:#84919f}.metric{font-size:29px;line-height:1.5;font-weight:700;margin:8px 0}.metricfoot{font-size:11px;color:#a0aab3}.pill{background:#e8f5ef;color:#408565;border-radius:4px;padding:2px 6px;font-size:11px}.panels{display:grid;grid-template-columns:1.4fr 1fr;gap:19px}.sectiontitle{font-size:16px;font-weight:700;margin:0 0 16px}.modulegrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.modulelink{border:1px solid var(--line);border-radius:9px;padding:13px;text-align:left;display:flex;justify-content:space-between;align-items:center}.modulelink:hover{border-color:#9bc6c7;background:#f8fcfb}.modulelink small{display:block;color:var(--muted)}.minirow{border-bottom:1px solid var(--line);padding:12px 0;display:flex;justify-content:space-between;gap:12px}.minirow:last-child{border:0}.tag{display:inline-block;border-radius:5px;padding:2px 9px;font-size:11px;background:#eef4fa;color:#4c7395}.tag.green{color:#4a8a73;background:#eaf6ef}.tag.orange{color:#a77b41;background:#fcf4e7}
.white{background:white;border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px}.filter{padding:19px 22px;margin-bottom:16px}.filterline{display:flex;flex-wrap:wrap;gap:12px;align-items:end}.field{display:flex;flex-direction:column;gap:6px;min-width:125px;flex:1}.field label{font-size:12px;color:#758493}.field input,.field select,.globalinput{border:1px solid #dfe5eb;border-radius:6px;padding:9px 11px;background:#fff;min-width:0;width:100%;outline:none}.field input:focus,.field select:focus,.globalinput:focus{border-color:var(--primary)}.field.wide{flex:2;min-width:190px}.tabletools{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line);gap:12px}.muted{color:var(--muted)}.tablewrap{overflow:auto;max-height:calc(100vh - 360px);min-height:260px}.data{border-collapse:collapse;white-space:nowrap;min-width:100%;font-size:13px}.data th{position:sticky;top:0;background:#f8fafb;color:#6d7c8a;text-align:left;font-size:12px;font-weight:600;z-index:1}.data th,.data td{border-bottom:1px solid #edf1f3;padding:12px 14px}.data td:first-child,.data th:first-child{padding-left:21px}.data tr:hover td{background:#fafcfc}.link{color:#247982;font-weight:650;cursor:pointer}.link:hover{text-decoration:underline}.tablefoot{padding:12px 18px;display:flex;justify-content:space-between;color:var(--muted);font-size:12px}.tabs{display:flex;gap:26px;border-bottom:1px solid var(--line);padding:0 22px}.tab{padding:13px 0;color:#7c8995;border-bottom:2px solid transparent}.tab.active{color:#237980;border-color:#237980;font-weight:700}.detailbody{padding:24px}.infogrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px 24px}.info label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}.info strong{font-weight:550;font-size:14px;overflow-wrap:anywhere}.fileline{display:flex;align-items:center;gap:15px;border-bottom:1px solid var(--line);padding:13px 0}.fileline:last-child{border:0}.fileicon{width:36px;height:40px;border-radius:7px;background:#ecf4f6;color:#247982;display:grid;place-items:center;font-size:11px;font-weight:750}.fileline strong{font-size:13px;display:block}.fileline small{font-size:11px;color:var(--muted)}.fileline .btn{margin-left:auto}.empty{padding:48px;text-align:center;color:#94a0aa}html[data-workspace="personal"]{--primary:#536f94;--pale:#eef2f9}
.detailsection{margin-bottom:17px}
.detailsectionhead{padding:16px 24px;display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line)}
.detailsectionhead h2{font-size:16px;margin:0}
.detailsection .detailbody{padding:21px 24px}
.detailsection .fileline:first-child{padding-top:0}
.previewmark{position:fixed;bottom:16px;right:18px;background:#304b56e8;color:#fff;font-size:11px;padding:7px 12px;border-radius:20px;pointer-events:none}
dialog{border:1px solid var(--line);border-radius:13px;padding:25px;box-shadow:0 25px 100px #30465b35;max-width:min(480px,92vw);width:100%}dialog::backdrop{background:#1d2f4466}dialog h3{margin:0 0 17px;font-size:18px}.dialogactions{margin-top:23px;display:flex;justify-content:flex-end;gap:10px}.notice{font-size:12px;color:#7c8b99;margin-top:8px}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#284552;color:#fff;padding:10px 18px;border-radius:8px;display:none;z-index:10}.toast.show{display:block}
@media(max-width:1060px){.sidebar{width:196px}.content{padding:22px}.cards{grid-template-columns:repeat(2,1fr)}.panels{grid-template-columns:1fr}.top{padding:0 18px}.topbadge{display:none}}
@media(max-width:650px){.sidebar{width:64px;padding:14px 5px}.brand{padding:0 4px 16px}.brand div:not(.logo),.nav span,.navlabel,.sidehint{display:none}.nav{justify-content:center}.top{gap:8px}.searchglobal input{width:90px}.content{padding:15px}.heading{align-items:flex-start;flex-direction:column}.cards{gap:9px}.card{padding:12px}.infogrid{grid-template-columns:repeat(2,1fr)}}
</style></head><body>
<div class="shell">
<aside class="sidebar"><div class="brand"><div class="logo">IP</div><div><b>资料管理系统</b><small>离线界面示例</small></div></div><div class="navlabel">工作空间</div><div id="sidebar"></div><div class="sidebottom"><div id="bottomnav"></div><div class="sidehint">界面设计 V0.1<br>本原型全部为模拟数据<br>不连接真实数据库</div></div></aside>
<div class="main"><header class="top"><button class="workspace" id="workspaceBtn">▣ <span id="workspacelabel">公司资料</span> <span style="color:#9aabb1">⌄</span></button><div class="searchglobal">⌕ <input id="globalSearch" placeholder="搜索当前工作区资料" title="回车搜索模拟数据"></div><span class="topbadge">● 离线界面演示</span><button class="topbutton" id="closeDbDemo">关闭数据库</button></header><main class="content" id="content"></main></div></div>
<div class="previewmark">UI 预览 V0.1 · 模拟数据</div><div class="toast" id="toast"></div>
<dialog id="dialog"><h3 id="dialogTitle">操作演示</h3><div id="dialogBody"></div><div class="dialogactions"><button class="btn" id="dialogClose">关闭</button><button class="btn primary" id="dialogConfirm">确认</button></div></dialog>
<script>
const icons={dashboard:'▦',ip:'◇',researchProject:'▤',horizontalProject:'▥',contract:'▧',certificate:'▣',general:'▥',trash:'♺',settings:'⚙'};
// Both workspaces have independent entry configuration and mock content.
const companyNav=[['dashboard','工作台'],['ip','知识产权'],['researchProject','科研项目'],['horizontalProject','横向项目'],['contract','全部合同'],['certificate','企业资质'],['general','综合资料']];
const personalNav=[['dashboard','个人工作台'],['ip','个人知识产权'],['researchProject','个人科研项目'],['horizontalProject','个人横向项目'],['contract','个人合同'],['certificate','个人证件'],['general','个人综合资料']];
let workspace='company',page='dashboard',detail=null,search='',kind='全部类型',state='全部状态',selected=new Set();
const ip=[
{name:'一种矿山机器人作业位置自主调整方法',type:'发明专利',code:'CN202410123456.7',status:'实质审查',owner:'示例科技有限公司',date:'2024-03-18',files:4},
{name:'液压支架协同控制装置',type:'实用新型',code:'CN202320234567.9',status:'已授权',owner:'示例科技有限公司',date:'2023-05-12',files:3},
{name:'矿山智能运维管理软件 V1.0',type:'软件著作权',code:'2026SR0123456',status:'已登记',owner:'示例科技有限公司',date:'2026-02-10',files:2},
{name:'一种水下探测设备安装结构',type:'实用新型',code:'CN202420345678.1',status:'申请中',owner:'示例科技有限公司',date:'2024-07-06',files:2},
{name:'IPSys 标识',type:'商标',code:'78901234',status:'申请中',owner:'示例科技有限公司',date:'2025-04-20',files:1}
];
const projects=[
{name:'矿山机器人研发项目',type:'科研项目',code:'XM-2026-001',status:'进行中',leader:'研发一组',date:'2026-01-10',files:8},
{name:'深海探测装备技术研究',type:'科研项目',code:'XM-2026-002',status:'筹备中',leader:'研发二组',date:'2026-05-02',files:3},
{name:'智能设备合作研发项目',type:'横向项目',code:'XM-2025-003',status:'已完成',leader:'研发三组',date:'2025-04-11',files:5}
];
const contracts=[
{name:'矿山机器人关键部件采购合同',project:'矿山机器人研发项目',code:'HT-2026-001',date:'2026-04-12',amount:'128000.00',files:2},
{name:'研发技术服务合同',project:'矿山机器人研发项目',code:'HT-2026-002',date:'2026-06-08',amount:'380000.00',files:3},
{name:'水下传感器采购合同',project:'深海探测装备技术研究',code:'HT-2026-003',date:'2026-07-20',amount:'',files:1}
];
const simple={certificate:[{name:'质量管理体系认证证书',type:'企业资质',files:2},{name:'高新技术企业证书',type:'企业资质',files:1}],general:[{name:'公司简介',type:'综合资料',files:2},{name:'产品宣传资料',type:'综合资料',files:3}]};
const personalIp=[
{name:'一种轻量化传感器安装方法',type:'发明专利',code:'CN202510112233.4',status:'申请中',owner:'个人示例',date:'2025-03-16',files:2},
{name:'个人技术资料整理工具 V1.0',type:'软件著作权',code:'2026SR0033445',status:'已登记',owner:'个人示例',date:'2026-04-02',files:1}
];
const personalProjects=[
{name:'个人专业技术研究课题',type:'科研项目',code:'GR-2026-001',status:'进行中',leader:'个人示例',date:'2026-02-15',files:2},
{name:'合作技术咨询项目',type:'横向项目',code:'GR-2025-002',status:'已完成',leader:'个人示例',date:'2025-08-03',files:1}
];
const personalContracts=[
{name:'个人技术咨询合同',project:'合作技术咨询项目',code:'GRHT-2025-01',date:'2025-09-12',amount:'12000.00',files:1}
];
const personalSimple={
certificate:[{name:'学历学位证书',type:'学历学位',files:2},{name:'专业技术资格证书',type:'职称资格',files:1}],
general:[{name:'个人专业资料',type:'综合资料',files:2},{name:'学习记录与参考文档',type:'综合资料',files:1}]
};
function isProject(key){return key==='researchProject'||key==='horizontalProject'}
function currentProjects(){return workspace==='company'?projects:personalProjects}
function currentContracts(){return workspace==='company'?contracts:personalContracts}
function records(key){
 if(key==='ip')return workspace==='company'?ip:personalIp;
 if(isProject(key))return currentProjects().filter(item=>item.type===(key==='researchProject'?'科研项目':'横向项目'));
 if(key==='contract')return currentContracts();
 if(key==='certificate'||key==='general')return (workspace==='company'?simple:personalSimple)[key];
 return [];
}
function navs(){return workspace==='company'?companyNav:personalNav}
function title(key){return navs().find(x=>x[0]===key)?.[1]||({trash:'回收站',settings:'系统设置',search:'全局搜索'}[key]||'详情')}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(window._tt);window._tt=setTimeout(()=>t.classList.remove('show'),2600)}
function modal(t,body,cb){document.getElementById('dialogTitle').textContent=t;document.getElementById('dialogBody').innerHTML=body;document.getElementById('dialogConfirm').onclick=()=>{document.getElementById('dialog').close();if(cb)cb();else toast('当前为界面设计演示，未写入数据')};document.getElementById('dialog').showModal()}
document.getElementById('dialogClose').onclick=()=>document.getElementById('dialog').close();
function setPage(p){page=p;detail=null;search='';kind='全部类型';state='全部状态';selected.clear();render()}
function chooseWorkspace(){modal('切换工作区','<p>两个工作区数据相互独立，此处只切换演示数据。</p><div class="actions"><button class="btn" onclick="changeWorkspace(\'company\')">▣ 公司资料</button><button class="btn" onclick="changeWorkspace(\'personal\')">♙ 个人资料</button></div>')}
function changeWorkspace(w){workspace=w;document.getElementById('dialog').close();setPage('dashboard')}
document.getElementById('workspaceBtn').onclick=chooseWorkspace;
document.getElementById('globalSearch').onkeydown=e=>{if(e.key==='Enter'){search=e.target.value.trim();page='search';detail=null;render()}};
document.getElementById('closeDbDemo').onclick=()=>modal('关闭数据库','<p>当前为独立 UI 演示，不持有数据库连接。实际关闭数据库请使用正式网页按钮，退出程序只能在 WinForms 窗口操作。</p>');
function refreshSidebar(){document.documentElement.dataset.workspace=workspace;document.getElementById('workspacelabel').textContent=workspace==='company'?'公司资料':'个人资料';document.getElementById('sidebar').innerHTML=navs().map(([k,n])=>'<button class="nav '+(page===k?'active':'')+'" onclick="setPage(\''+k+'\')"><span style="font-size:17px;width:18px;text-align:center">'+icons[k]+'</span><span>'+n+'</span></button>').join('');document.getElementById('bottomnav').innerHTML=[['trash','回收站'],['settings','系统设置']].map(([k,n])=>'<button class="nav '+(page===k?'active':'')+'" onclick="setPage(\''+k+'\')"><span style="font-size:17px;width:18px;text-align:center">'+icons[k]+'</span><span>'+n+'</span></button>').join('')}
function status(s){let cl=s==='已授权'||s==='已登记'||s==='已完成'?'green':s==='实质审查'||s==='进行中'?'orange':'';return '<span class="tag '+cl+'">'+(s||'—')+'</span>'}
function head(name,sub,actions=''){return '<div class="breadcrumb">'+(workspace==='company'?'公司资料':'个人资料')+' / '+name+'</div><div class="heading"><div><h1>'+name+'</h1><div class="subtitle">'+sub+'</div></div><div class="actions">'+actions+'</div></div>'}
function dash(){
 const mods=navs().filter(([k])=>k!=='dashboard').map(([k,n])=>[k,n,records(k).length]);
 return head(title('dashboard'),(workspace==='company'?'公司资料工作区':'个人资料工作区')+' · 独立的示例记录和导航')+
 '<div class="cards">'+mods.slice(0,4).map(([k,n,num])=>'<div class="card"><div class="metriclabel">'+n+'</div><div class="metric">'+num+'</div><div class="metricfoot">条演示记录 <span class="pill" style="float:right">示例</span></div></div>').join('')+'</div>'+
 '<div class="panels"><section class="card"><h2 class="sectiontitle">业务模块快捷入口</h2><div class="modulegrid">'+mods.map(([k,n,num])=>'<button class="modulelink" onclick="setPage(\''+k+'\')"><div><b>'+n+'</b><small>'+num+' 条记录</small></div><span style="color:#9caebb">→</span></button>').join('')+'</div></section>'+
 '<section class="card"><h2 class="sectiontitle">资料概况</h2><div class="minirow"><span>当前工作区</span><span class="tag">'+(workspace==='company'?'公司资料':'个人资料')+'</span></div><div class="minirow"><span>科研项目</span><strong>'+records('researchProject').length+' 条</strong></div><div class="minirow"><span>横向项目</span><strong>'+records('horizontalProject').length+' 条</strong></div><div class="minirow"><span>合同归属</span><span class="muted">全部归属于具体项目</span></div><p class="notice">切换工作区将显示另一套模拟数据；正式版同样需要严格隔离工作区记录与附件。</p></section></div>';
}
function tableCols(k){if(k==='ip')return [['name','知识产权名称'],['type','知识产权类型'],['code','申请/登记号'],['status','状态'],['owner','当前权利人'],['date','申请/登记日期'],['files','附件']];if(isProject(k))return [['name','项目名称'],['type','项目类别'],['code','项目编号'],['status','项目状态'],['leader','负责人'],['date','开始日期'],['files','附件']];if(k==='contract')return [['name','合同名称'],['project','所属项目'],['code','合同编号'],['date','签订日期'],['amount','合同金额（元）'],['files','附件']];return [['name','名称'],['type','类别'],['files','附件']]}
function tablePage(k){let data=visibleRecords(k);const types=[...new Set(records(k).map(x=>x.type).filter(Boolean))],states=[...new Set(records(k).map(x=>x.status).filter(Boolean))],cols=tableCols(k);
return head(title(k)+'台账','结构化记录列表 · 支持筛选和连续滚动的页面原型','<button class="btn" onclick="toast(\'Excel 列表导出将在功能阶段实现\')">导出 Excel</button>'+(k==='contract'?'':'<button class="btn primary" onclick="newRecord(\''+k+'\')">+ 新建'+(isProject(k)?'项目':'记录')+'</button>'))+
'<section class="white filter"><div class="filterline"><div class="field wide"><label>名称 / 编号 / 关键词</label><input id="filterSearch" placeholder="输入关键词搜索" value="'+search.replace(/"/g,'&quot;')+'"></div><div class="field"><label>类别/类型</label><select id="filterKind"><option>全部类型</option>'+types.map(t=>'<option '+(kind===t?'selected':'')+'>'+t+'</option>').join('')+'</select></div>'+(states.length?'<div class="field"><label>状态</label><select id="filterState"><option>全部状态</option>'+states.map(t=>'<option '+(state===t?'selected':'')+'>'+t+'</option>').join('')+'</select></div>':'')+'<button class="btn primary" id="applyFilter">查询</button><button class="btn" onclick="search=\'\';kind=\'全部类型\';state=\'全部状态\';render()">重置</button></div></section>'+
'<section class="white"><div class="tabletools"><span><b>'+title(k)+'记录</b> <span class="muted" style="margin-left:9px">共 '+data.length+' 条</span></span><div class="actions"><button class="btn" id="batchBtn">批量操作（'+selected.size+'）</button><button class="btn" onclick="toast(\'列设置功能后续接入\')">⚙ 列设置</button></div></div><div class="tablewrap"><table class="data"><thead><tr><th><input type="checkbox" id="selectAll"></th>'+cols.map(c=>'<th>'+c[1]+'</th>').join('')+'<th>操作</th></tr></thead><tbody>'+data.map((r,i)=>'<tr><td><input type="checkbox" class="rowcheck" data-name="'+r.name.replace(/"/g,'&quot;')+'" '+(selected.has(r.name)?'checked':'')+'></td>'+cols.map(([key])=>'<td>'+(key==='name'?'<a class="link" data-detail="'+i+'">'+r.name+'</a>':key==='status'?status(r.status):key==='files'?r.files+' 份':key==='amount'?(r.amount||'—'):r[key]||'—')+'</td>').join('')+'<td><button class="link" data-detail="'+i+'">查看详情</button></td></tr>').join('')+'</tbody></table></div><div class="tablefoot"><span>示例数据 · 表格将支持原位编辑、复制粘贴、列配置</span><span>已显示 '+data.length+' / '+data.length+' 条</span></div></section>'}
function newRecord(k){
 const fields=k==='ip'
 ? '<div class="field"><label>知识产权类型 *</label><select><option>发明专利</option><option>实用新型</option><option>外观设计</option><option>软件著作权</option><option>商标</option><option>其他著作权</option><option>集成电路布图设计</option></select></div>'
 : isProject(k)?'<div class="field"><label>项目类别</label><input value="'+(k==='researchProject'?'科研项目':'横向项目')+'" disabled></div>':'';
 modal('新建'+title(k),'<div class="field"><label>名称 *</label><input placeholder="请输入名称"></div>'+fields+'<p class="notice">本预览不保存数据，项目类别由当前入口确定。</p>');
}
function visibleRecords(k){
 return records(k).filter(x=>(!search||Object.values(x).some(y=>String(y).toLowerCase().includes(search.toLowerCase())))&&(kind==='全部类型'||x.type===kind)&&(state==='全部状态'||x.status===state));
}
function openDetail(k,index){
 const row=visibleRecords(k)[index];
 if(!row)return toast('当前记录不存在');
 detail={key:k,row};render();
}
function openContract(name){
 const row=currentContracts().find(c=>c.name===name);
 if(row){detail={key:'contract',row};render();}
}
function block(name,body,action=''){
 return '<section class="white detailsection"><div class="detailsectionhead"><h2>'+name+'</h2>'+action+'</div><div class="detailbody">'+body+'</div></section>';
}
function fileRow(file,format,meta){
 return '<div class="fileline"><input type="checkbox" aria-label="选择 '+file+'"><div class="fileicon">'+format+'</div><div><strong>'+file+'</strong><small>'+meta+'</small></div><button class="btn" onclick="toast(\'文件操作仅为设计演示\')">'+(format==='PDF'?'预览':'导出原件')+'</button></div>';
}
function fileSection(name,rows){
 return block(name,
 (rows.length?rows.join(''):'<div class="empty">当前暂无示例附件</div>')+
 '<p class="notice">附件必须归属于记录，勾选后可按原始文件名导出。正式版不从此演示页面存取真实文件。</p>',
 '<button class="btn" onclick="toast(\'附件上传和导出尚未接入\')">+ 添加 / 导出附件</button>');
}
function detailPage(){
 const k=detail.key,r=detail.row,proj=isProject(k);
 const info=proj?[
 ['项目名称',r.name],['项目类别',r.type],['项目编号',r.code],['项目状态',r.status],['负责人',r.leader],['开始日期',r.date],['结束日期','—'],['承担单位','—']]
 :k==='ip'?[
 ['知识产权名称',r.name],['知识产权类型',r.type],['申请/登记号',r.code],['当前状态',r.status],['当前权利人',r.owner],['申请/登记日期',r.date],['申请人','—'],['发明人/作者','—']]
 :k==='contract'?[
 ['合同名称',r.name],['所属项目',r.project],['合同编号',r.code],['签订日期',r.date],['合同金额（人民币）',r.amount?Number(r.amount).toFixed(2):'—'],['签约主体','—']]
 :[['名称',r.name],['类别',r.type],['备注','—'],['标签','—']];
 const basics='<div class="infogrid">'+info.map(([n,v])=>'<div class="info"><label>'+n+'</label><strong>'+(/状态/.test(n)?status(v):v||'—')+'</strong></div>').join('')+'</div>';
 let out='<div class="breadcrumb">'+(workspace==='company'?'公司资料':'个人资料')+' / '+title(k)+' / 记录详情</div>'+
 '<div class="heading"><div><button class="link" onclick="detail=null;render()">← 返回'+title(k)+'台账</button><h1 style="margin-top:12px">'+r.name+'</h1><span class="subtitle">全部信息在当前页纵向展开 · 模拟数据</span></div><div class="actions"><button class="btn" onclick="toast(\'演示模式未接入编辑\')">编辑记录</button><button class="btn primary" onclick="toast(\'演示模式不上传文件\')">添加附件</button></div></div>';
 out+=block('基本信息',basics);
 if(k==='ip'){
   out+=block('申请与登记信息','<div class="infogrid"><div class="info"><label>申请/登记号</label><strong>'+r.code+'</strong></div><div class="info"><label>申请/登记日期</label><strong>'+r.date+'</strong></div><div class="info"><label>公开/公告信息</label><strong>—</strong></div><div class="info"><label>备注</label><strong>—</strong></div></div>');
   out+=fileSection('知识产权附件',[
     fileRow('专利申请文件.pdf','PDF','材料类别：申请材料 · 1.8 MB · v1'),
     fileRow('受理通知书.pdf','PDF','材料类别：通知文件 · 0.6 MB · v1'),
     fileRow('电子证书.pdf','PDF','材料类别：证书文件 · 1.1 MB · v2')
   ]);
 }else if(proj){
   const related=currentContracts().filter(c=>c.project===r.name);
   const contractRows=related.length?related.map(c=>'<div class="minirow"><span><button class="link" onclick="openContract(\''+c.name+'\')">'+c.name+'</button><br><small class="muted">'+c.code+'</small></span><span>'+ (c.amount?Number(c.amount).toFixed(2)+' 元':'金额未填写')+'</span></div>').join(''):'<div class="empty">当前项目暂无合同</div>';
   out+=block('所属合同',contractRows,'<button class="btn primary" onclick="modal(\'新建合同\',\'<p>新建合同仅允许从本项目详情进入。这里只演示入口。</p>\')">+ 新建合同</button>');
   out+=fileSection('项目自身附件',[
     fileRow('项目实施方案.pdf','PDF','项目原件 · 2.4 MB · v1'),
     fileRow('项目说明.docx','DOC','项目原件 · 0.8 MB · v2')
   ]);
   out+=block('全部附件汇总',
     '<p class="notice">此处汇总项目附件及其所属合同附件，不新建文件副本。</p>'+
     '<div class="minirow"><strong>项目自身附件</strong><span class="muted">2 份示例</span></div>'+
     related.map(c=>'<div class="minirow"><span>'+c.name+'</span><span class="muted">'+c.files+' 份示例附件</span></div>').join(''),
     '<button class="btn" onclick="toast(\'正式版按勾选结果导出\')">导出所选附件</button>');
 }else{
   out+=fileSection(k==='contract'?'合同附件':'附件资料',[fileRow('归档材料.pdf','PDF','原始文件名：归档材料.pdf · 1.2 MB · v1')]);
 }
 out+=block('关联资料','<div class="empty">暂无已关联的演示记录</div>');
 return out;
}
function searchPage(){const term=search;let groups=navs().filter(x=>x[0]!=='dashboard').map(([k,n])=>({k,n,items:records(k).filter(r=>Object.values(r).some(v=>String(v).toLowerCase().includes(term.toLowerCase())))})).filter(x=>x.items.length);return head('统一搜索', '仅检索当前工作区的记录及附件元数据 · 当前关键词：'+(term||'（空）'))+(groups.length?groups.map(g=>'<section class="card" style="margin-bottom:15px"><h2 class="sectiontitle">'+g.n+'（'+g.items.length+'）</h2>'+g.items.map(x=>'<div class="minirow"><span>'+x.name+'</span><button class="link" onclick="setPage(\''+g.k+'\')">进入模块 →</button></div>').join('')+'</section>').join(''):'<section class="card empty">没有找到匹配的模拟记录</section>')}
function otherPage(){return head(title(page),page==='trash'?'展示回收站界面布局，不包含一键清空': '当前数据库信息与已确认的维护操作')+(page==='trash'?'<section class="white"><div class="tabletools"><b>已删除资料</b><button class="btn danger" onclick="toast(\'仅界面演示\')">永久删除所选</button></div><div class="empty">当前没有已删除的模拟资料</div></section>':'<section class="card"><h2 class="sectiontitle">数据库与安全</h2><div class="minirow"><span>当前数据库</span><span class="muted">示例数据库（未真实连接）</span></div><div class="minirow"><span>修改数据库密码</span><button class="btn" onclick="toast(\'仅界面演示\')">修改密码</button></div><div class="minirow"><span>检查数据库完整性</span><button class="btn" onclick="toast(\'仅界面演示\')">执行检查</button></div><div class="minirow"><span>类别与标签</span><button class="btn" onclick="toast(\'仅界面演示\')">管理类别</button></div><p class="notice">根据需求，数据库备份需安全退出后在 Windows 资源管理器手动复制，不提供自动备份。</p></section>')}
function bindTable(){const f=document.getElementById('applyFilter');if(f)f.onclick=()=>{search=document.getElementById('filterSearch').value;kind=document.getElementById('filterKind').value;state=document.getElementById('filterState')?.value||'全部状态';selected.clear();render()};
document.querySelectorAll('[data-detail]').forEach(x=>x.onclick=()=>openDetail(page,Number(x.dataset.detail)));
document.querySelectorAll('.rowcheck').forEach(c=>c.onchange=()=>{if(c.checked)selected.add(c.dataset.name);else selected.delete(c.dataset.name);const b=document.getElementById('batchBtn');if(b)b.textContent='批量操作（'+selected.size+'）'});
const all=document.getElementById('selectAll');if(all)all.onchange=()=>{document.querySelectorAll('.rowcheck').forEach(c=>{c.checked=all.checked;if(c.checked)selected.add(c.dataset.name);else selected.delete(c.dataset.name)});document.getElementById('batchBtn').textContent='批量操作（'+selected.size+'）'};
const b=document.getElementById('batchBtn');if(b)b.onclick=()=>selected.size?modal('批量操作','<p>已选择 '+selected.size+' 条记录。正式版将仅允许批量修改适用的类别、状态、标签等字段，并在提交前再次确认。</p>'):toast('请先勾选记录')}
function render(){
 refreshSidebar();
 document.getElementById('content').innerHTML=detail?detailPage():
 page==='dashboard'?dash():
 ['ip','researchProject','horizontalProject','contract','certificate','general'].includes(page)?tablePage(page):
 page==='search'?searchPage():otherPage();
 if(!detail)bindTable();
}
render();
</script></body></html>
