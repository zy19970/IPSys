name: Publish IPSys Release

# 手动发布；正常 push 只构建和验收。
on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号，例如 v0.1.0 或 v0.1.0-rc.1（不可复用）'
        required: true
        type: string
      prerelease:
        description: '作为预发布版本（开发阶段建议勾选）'
        required: true
        type: boolean
        default: true

permissions:
  contents: read

# 同一时间只执行一次发布，不取消正在上传的版本。
concurrency:
  group: ipsys-manual-release
  cancel-in-progress: false

jobs:
  validate:
    name: Check branch and version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require main and an unused version
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != 'refs/heads/main' ]]; then
            echo '只能在 main 分支手动发布；请在 Run workflow 菜单中选择 main。' >&2
            exit 1
          fi
          if [[ ! "$RELEASE_VERSION" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo '版本号格式错误：请使用 v1.2.3 或 v1.2.3-rc.1。' >&2
            exit 1
          fi
          status=0
          git ls-remote --tags --exit-code origin "refs/tags/$RELEASE_VERSION" > /dev/null || status=$?
          if [[ "$status" -eq 0 ]]; then
            echo "版本标签 $RELEASE_VERSION 已存在，禁止覆盖；请填写新版本号。" >&2
            exit 1
          elif [[ "$status" -ne 2 ]]; then
            echo "未能核实远程版本标签（git 退出码 $status），中止发布。" >&2
            exit 1
          fi
          echo "发布前检查通过：$RELEASE_VERSION，源码 $GITHUB_SHA"

  build:
    name: Build release EXEs (no smoke)
    needs: validate
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"
      # MSBuild embeds the Explorer frontend using Node during dotnet publish.
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Build both Windows x64 single EXEs
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          # e.g. v0.9.2-rc.1 -> FileVersion 0.9.2.0; ProductVersion 0.9.2-rc.1.
          $productVersion = $env:RELEASE_VERSION.Substring(1)
          $components = ($productVersion -split '-',2)[0].Split('.')
          if ($components.Count -ne 3) { throw 'Invalid three-part release version' }
          foreach ($part in $components) {
            if ([long]$part -gt 65535) { throw 'Windows file version components must be <= 65535' }
          }
          $fileVersion = "$($components[0]).$($components[1]).$($components[2]).0"
          # Freeze a complete calendar date in UTC+8 across both EXE builds.
          $copyrightDate = [System.DateTime]::UtcNow.AddHours(8).ToString('yyyy-MM-dd')
          $expectedCopyright = "Copyright (C) Joey@BGRIMM $copyrightDate"
          $metadata = @("-p:Version=$productVersion", "-p:FileVersion=$fileVersion",
                        "-p:InformationalVersion=$productVersion", "-p:IPSysCopyrightDate=$copyrightDate")
          dotnet publish src/IPSys.Web/IPSys.Web.csproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true @metadata -o artifacts/IPSys-Web-win-x64
          if ($LASTEXITCODE -ne 0) { throw 'Framework-dependent Release build failed' }
          dotnet publish src/IPSys.Web/IPSys.Web.csproj -c Release -r win-x64 --self-contained true -p:SelfContained=true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true @metadata -o artifacts/IPSys-Web-win-x64-self-contained
          if ($LASTEXITCODE -ne 0) { throw 'Self-contained Release build failed' }
          # Packaging verification, not a smoke test: catch DLL/JSON/PDB
          # sidecars in either output folder before uploading only the EXE.
          foreach ($folder in @('artifacts/IPSys-Web-win-x64',
                                'artifacts/IPSys-Web-win-x64-self-contained')) {
            $exe = Join-Path $folder 'IPSys.Web.exe'
            if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) {
              throw "Release EXE missing: $exe"
            }
            $unexpected = @(Get-ChildItem -LiteralPath $folder -Force |
              Where-Object { $_.Name -ne 'IPSys.Web.exe' })
            if ($unexpected.Count -ne 0) {
              $unexpected | Select-Object Name,Length | Format-Table -AutoSize
              throw "Release output must contain only IPSys.Web.exe: $folder"
            }
            # Inspect the actual Windows PE VERSIONINFO, without launching EXEs.
            $details = [System.Diagnostics.FileVersionInfo]::GetVersionInfo((Resolve-Path -LiteralPath $exe).Path)
            if ($details.FileDescription -ne 'IPSys 资料管理系统' -or
                $details.ProductName -ne 'IPSys 资料管理系统' -or
                $details.CompanyName -ne 'Joey@BGRIMM' -or
                $details.LegalCopyright -ne $expectedCopyright -or
                $details.FileVersion -ne $fileVersion -or
                $details.ProductVersion -ne $productVersion) {
              throw "Release EXE VERSIONINFO mismatch: $folder; description=$($details.FileDescription); product=$($details.ProductName); company=$($details.CompanyName); fileVersion=$($details.FileVersion); productVersion=$($details.ProductVersion); copyright=$($details.LegalCopyright)"
            }
          }
          Write-Host "Windows EXE metadata PASS: $productVersion, $fileVersion, $expectedCopyright"
          Write-Host 'Two release single-EXE directories verified. No smoke was run.'
      - name: Upload framework-dependent EXE
        uses: actions/upload-artifact@v6
        with:
          name: IPSys-Web-win-x64
          path: artifacts/IPSys-Web-win-x64/IPSys.Web.exe
          if-no-files-found: error
      - name: Upload self-contained EXE
        uses: actions/upload-artifact@v6
        with:
          name: IPSys-Web-win-x64-self-contained
          path: artifacts/IPSys-Web-win-x64-self-contained/IPSys.Web.exe
          if-no-files-found: error

  publish:
    name: Publish both built EXEs to GitHub Releases
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download framework-dependent EXE from this run
        uses: actions/download-artifact@v4
        with:
          name: IPSys-Web-win-x64
          path: release-input/framework-dependent
      - name: Download self-contained EXE from this run
        uses: actions/download-artifact@v4
        with:
          name: IPSys-Web-win-x64-self-contained
          path: release-input/self-contained
      - name: Require both single EXEs and verify SHA-256
        shell: bash
        run: |
          set -euo pipefail
          for mode in framework-dependent self-contained; do
            test -s "release-input/$mode/IPSys.Web.exe"
            count=$(find "release-input/$mode" -type f | wc -l)
            if [[ "$count" -ne 1 ]]; then
              echo "构建产物 $mode 不是单 EXE（收到 $count 个文件）。" >&2
              exit 1
            fi
          done
          mkdir -p release
          cp release-input/framework-dependent/IPSys.Web.exe release/IPSys-win-x64-FrameworkDependent.exe
          cp release-input/self-contained/IPSys.Web.exe release/IPSys-win-x64-SelfContained.exe
          framework_bytes=$(stat -c%s release/IPSys-win-x64-FrameworkDependent.exe)
          self_bytes=$(stat -c%s release/IPSys-win-x64-SelfContained.exe)
          if [[ "$self_bytes" -le "$framework_bytes" ]]; then
            echo "自包含版体积未大于依赖环境版，疑似缺失运行时。" >&2
            exit 1
          fi
          (cd release && sha256sum IPSys-win-x64-FrameworkDependent.exe IPSys-win-x64-SelfContained.exe > SHA256SUMS.txt)
          (cd release && sha256sum --check SHA256SUMS.txt)
          echo "两个独立 EXE 的完整性与 SHA-256：验证通过"
      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          IS_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          # 构建和发布期间有新提交就拒绝发布旧构建。
          current=$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')
          if [[ "$current" != "$GITHUB_SHA" ]]; then
            echo '测试期间 main 有新提交；本次不发布旧构建。请重新从 main 触发。' >&2
            exit 1
          fi
          # 复查标签，防止测试期间被其他发布过程占用。
          status=0
          git ls-remote --tags --exit-code origin "refs/tags/$RELEASE_VERSION" > /dev/null || status=$?
          if [[ "$status" -eq 0 ]]; then
            echo "版本标签 $RELEASE_VERSION 已存在；拒绝覆盖。" >&2
            exit 1
          elif [[ "$status" -ne 2 ]]; then
            echo "无法确认 $RELEASE_VERSION 未被使用，中止发布。" >&2
            exit 1
          fi
          cat > release-notes.md <<EOF
          IPSys Windows x64 资料管理系统（正式前端 / SQLCipher V2）。

          - 对应提交：$GITHUB_SHA
          - 发布流程：手动触发，只构建两种 Windows EXE 并核验产物，不重复运行 smoke。
          - 功能验收：发布人已在独立的 Windows CI 和本机确认；本次 Release 运行不重新执行测试。
          - IPSys-win-x64-SelfContained.exe：自包含版，已打包 .NET 8 Windows Desktop 和 ASP.NET Core 运行时，目标 Windows x64 机器无需另外安装 .NET 8；文件体积较大。
          - IPSys-win-x64-FrameworkDependent.exe：依赖环境版，体积较小，目标机器需自行安装 .NET 8 Windows Desktop Runtime (x64) 和 ASP.NET Core Runtime 8 (x64)。
          - SHA256SUMS.txt：同时记录这两份 EXE 的 SHA-256，用于下载后检查完整性。
          - 自包含版携带发布时的 .NET 运行时，更新 .NET 安全补丁需要重新构建发布新版 EXE。
          - 说明：2 GiB / 4 GiB 大文件专项压测不属于普通发布门禁，参阅仓库测试文档。

          本次构建与发布：https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          EOF
          args=()
          if [[ "$IS_PRERELEASE" == 'true' ]]; then args+=(--prerelease); fi
          gh release create "$RELEASE_VERSION" \
            release/IPSys-win-x64-FrameworkDependent.exe release/IPSys-win-x64-SelfContained.exe release/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "IPSys $RELEASE_VERSION" \
            --notes-file release-notes.md \
            "${args[@]}"
          url=$(gh release view "$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" --json url --jq '.url')
          echo "发布成功：$url" >> "$GITHUB_STEP_SUMMARY"
          echo "产物：IPSys-win-x64-SelfContained.exe、IPSys-win-x64-FrameworkDependent.exe、SHA256SUMS.txt" >> "$GITHUB_STEP_SUMMARY"
          echo "源码：$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
