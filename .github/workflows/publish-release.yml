name: Publish IPSys Release

# 手动发布；正常 push 只构建和验收。
on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号，例如 v0.1.0 或 v0.1.0-rc.1（不可复用）'
        required: true
        type: string
      prerelease:
        description: '作为预发布版本（开发阶段建议勾选）'
        required: true
        type: boolean
        default: true

permissions:
  contents: read

# 同一时间只执行一次发布，不取消正在上传的版本。
concurrency:
  group: ipsys-manual-release
  cancel-in-progress: false

jobs:
  validate:
    name: Check branch and version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require main and an unused version
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != 'refs/heads/main' ]]; then
            echo '只能在 main 分支手动发布；请在 Run workflow 菜单中选择 main。' >&2
            exit 1
          fi
          if [[ ! "$RELEASE_VERSION" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo '版本号格式错误：请使用 v1.2.3 或 v1.2.3-rc.1。' >&2
            exit 1
          fi
          status=0
          git ls-remote --tags --exit-code origin "refs/tags/$RELEASE_VERSION" > /dev/null || status=$?
          if [[ "$status" -eq 0 ]]; then
            echo "版本标签 $RELEASE_VERSION 已存在，禁止覆盖；请填写新版本号。" >&2
            exit 1
          elif [[ "$status" -ne 2 ]]; then
            echo "未能核实远程版本标签（git 退出码 $status），中止发布。" >&2
            exit 1
          fi
          echo "发布前检查通过：$RELEASE_VERSION，源码 $GITHUB_SHA"

  verify:
    name: Complete Windows acceptance
    needs: validate
    # 复用现行 Windows CI：Debug、Release、MCP、Node、真实 Edge/HTTP、SQLCipher。
    uses: ./.github/workflows/web-windows.yml
    permissions:
      contents: read

  publish:
    name: Publish both tested EXEs to GitHub Releases
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download framework-dependent EXE from this run
        uses: actions/download-artifact@v4
        with:
          name: IPSys-Web-win-x64
          path: release-input/framework-dependent
      - name: Download self-contained EXE from this run
        uses: actions/download-artifact@v4
        with:
          name: IPSys-Web-win-x64-self-contained
          path: release-input/self-contained
      - name: Require both single EXEs and verify SHA-256
        shell: bash
        run: |
          set -euo pipefail
          for mode in framework-dependent self-contained; do
            test -s "release-input/$mode/IPSys.Web.exe"
            count=$(find "release-input/$mode" -type f | wc -l)
            if [[ "$count" -ne 1 ]]; then
              echo "构建产物 $mode 不是单 EXE（收到 $count 个文件）。" >&2
              exit 1
            fi
          done
          mkdir -p release
          cp release-input/framework-dependent/IPSys.Web.exe release/IPSys-win-x64-FrameworkDependent.exe
          cp release-input/self-contained/IPSys.Web.exe release/IPSys-win-x64-SelfContained.exe
          framework_bytes=$(stat -c%s release/IPSys-win-x64-FrameworkDependent.exe)
          self_bytes=$(stat -c%s release/IPSys-win-x64-SelfContained.exe)
          if [[ "$self_bytes" -le "$framework_bytes" ]]; then
            echo "自包含版体积未大于依赖环境版，疑似缺失运行时。" >&2
            exit 1
          fi
          (cd release && sha256sum IPSys-win-x64-FrameworkDependent.exe IPSys-win-x64-SelfContained.exe > SHA256SUMS.txt)
          (cd release && sha256sum --check SHA256SUMS.txt)
          echo "两个独立 EXE 的完整性与 SHA-256：验证通过"
      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          IS_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          # 测试期间有新提交就拒绝发布旧构建。
          current=$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')
          if [[ "$current" != "$GITHUB_SHA" ]]; then
            echo '测试期间 main 有新提交；本次不发布旧构建。请重新从 main 触发。' >&2
            exit 1
          fi
          # 复查标签，防止测试期间被其他发布过程占用。
          status=0
          git ls-remote --tags --exit-code origin "refs/tags/$RELEASE_VERSION" > /dev/null || status=$?
          if [[ "$status" -eq 0 ]]; then
            echo "版本标签 $RELEASE_VERSION 已存在；拒绝覆盖。" >&2
            exit 1
          elif [[ "$status" -ne 2 ]]; then
            echo "无法确认 $RELEASE_VERSION 未被使用，中止发布。" >&2
            exit 1
          fi
          cat > release-notes.md <<EOF
          IPSys Windows x64 资料管理系统（正式前端 / SQLCipher V2）。

          - 对应提交：$GITHUB_SHA
          - 验收依据：本次发布工作流调用的完整 Windows CI 已通过（Debug、Release、MCP、Node、Edge/HTTP、SQLCipher）。
          - IPSys-win-x64-SelfContained.exe：自包含版，已打包 .NET 8 Windows Desktop 和 ASP.NET Core 运行时，目标 Windows x64 机器无需另外安装 .NET 8；文件体积较大。
          - IPSys-win-x64-FrameworkDependent.exe：依赖环境版，体积较小，目标机器需自行安装 .NET 8 Windows Desktop Runtime (x64) 和 ASP.NET Core Runtime 8 (x64)。
          - SHA256SUMS.txt：同时记录这两份 EXE 的 SHA-256，用于下载后检查完整性。
          - 自包含版携带发布时的 .NET 运行时，更新 .NET 安全补丁需要重新构建发布新版 EXE。
          - 说明：2 GiB / 4 GiB 大文件专项压测不属于普通发布门禁，参阅仓库测试文档。

          构建与验收：https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          EOF
          args=()
          if [[ "$IS_PRERELEASE" == 'true' ]]; then args+=(--prerelease); fi
          gh release create "$RELEASE_VERSION" \
            release/IPSys-win-x64-FrameworkDependent.exe release/IPSys-win-x64-SelfContained.exe release/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "IPSys $RELEASE_VERSION" \
            --notes-file release-notes.md \
            "${args[@]}"
          url=$(gh release view "$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" --json url --jq '.url')
          echo "发布成功：$url" >> "$GITHUB_STEP_SUMMARY"
          echo "产物：IPSys-win-x64-SelfContained.exe、IPSys-win-x64-FrameworkDependent.exe、SHA256SUMS.txt" >> "$GITHUB_STEP_SUMMARY"
          echo "源码：$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
