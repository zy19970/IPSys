name: M1 Windows SQLCipher prototype

on:
  push:
    branches: [main]
    paths:
      - "src/IPSys.M1/**"
      - ".github/workflows/m1-windows.yml"
  workflow_dispatch:

jobs:
  windows-smoke:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Publish self-contained Windows x64
        shell: pwsh
        run: dotnet publish src/IPSys.M1/IPSys.M1.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o artifacts/IPSys-M1-win-x64
      - name: Execute SQLCipher smoke integration test
        shell: pwsh
        run: .\artifacts\IPSys-M1-win-x64\IPSys.M1.exe smoke
      - name: Upload Windows prototype
        uses: actions/upload-artifact@v4
        with:
          name: IPSys-M1-win-x64
          path: artifacts/IPSys-M1-win-x64/
          if-no-files-found: error
