name: IPSys minimal web Windows test

on:
  push:
    branches: [main]
    paths:
      - "src/IPSys.Web/**"
      - ".github/workflows/web-windows.yml"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Publish Windows x64 portable web app
        shell: pwsh
        run: dotnet publish src/IPSys.Web/IPSys.Web.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o artifacts/IPSys-Web-win-x64
      - name: Verify browser JavaScript syntax
        shell: pwsh
        run: node --check src/IPSys.Web/wwwroot/app.js
      - name: Verify SQLCipher and local HTTP roundtrip
        shell: pwsh
        run: |
          $report = Join-Path $env:RUNNER_TEMP 'ipsys-web-smoke.txt'
          $env:IPSYS_SMOKE_REPORT = $report
          $exe = (Resolve-Path '.\artifacts\IPSys-Web-win-x64\IPSys.Web.exe').Path
          $proc = Start-Process -FilePath $exe -ArgumentList '--smoke' -PassThru -Wait
          if ($proc.ExitCode -ne 0) { throw "WinExe smoke failed (exit $($proc.ExitCode))" }
          if (-not (Test-Path $report)) { throw "Smoke completion report missing" }
          if ((Get-Content $report -Raw) -notmatch 'WEB SMOKE PASS') { throw "Smoke assertions incomplete" }
          Write-Host "WEB SMOKE PASS (WinExe process finished; report verified)"
      - name: Upload Windows executable and static assets
        uses: actions/upload-artifact@v4
        with:
          name: IPSys-Web-win-x64
          path: artifacts/IPSys-Web-win-x64/
          if-no-files-found: error