name: IPSys Windows build and smoke

on:
  workflow_call:
  push:
    branches: [main, "work/onedrive-file-manager"]
    paths:
      - "src/IPSys.Web/**"
      - "src/IPSys.Web/wwwroot/**"
      - "tests/retest-v2-2026-10-22/scripts/**"
      - "tests/retest-v2-2026-10-22/evidence/fixture.json"
      - ".github/workflows/web-windows.yml"
      - ".github/workflows/publish-release.yml"
  workflow_dispatch:
    inputs:
      large_file_smoke:
        description: 'Run a real >2 GiB SQLCipher upload/download on this Windows runner'
        type: boolean
        required: false
        default: false
      zip64_file_smoke:
        description: 'Generate a real >4 GiB ZIP64 archive using the production exporter (no extraction)'
        type: boolean
        required: false
        default: false

jobs:
  smoke:
    runs-on: windows-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      # The shell is bundled from src/IPSys.Web/wwwroot by an MSBuild target that
      # shells out to Node, so the toolchain has to be present before any build.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify Visual Studio Debug embedded web assets
        shell: pwsh
        run: |
          dotnet build src/IPSys.Web/IPSys.Web.csproj -c Debug
          if ($LASTEXITCODE -ne 0) { throw "Debug compilation failed" }
          $debugFolder = Join-Path $PWD 'src/IPSys.Web/bin/Debug/net8.0-windows'
          if (Test-Path (Join-Path $debugFolder 'wwwroot')) {
            throw 'Debug build still contains external wwwroot'
          }
          $report = Join-Path $env:RUNNER_TEMP 'ipsys-debug-smoke.txt'
          $env:IPSYS_SMOKE_REPORT = $report
          $exe = Join-Path $debugFolder 'IPSys.Web.exe'
          $proc = Start-Process -FilePath $exe -ArgumentList '--smoke' -PassThru -Wait
          if ($proc.ExitCode -ne 0) {
            if (Test-Path $report) { Write-Host (Get-Content $report -Raw) }
            throw "Debug executable smoke failed (exit $($proc.ExitCode))"
          }
          if (-not (Test-Path $report)) { throw "Debug smoke report missing" }
          if ((Get-Content $report -Raw) -notmatch 'WEB SMOKE PASS') { throw "Debug smoke assertions incomplete" }
          Write-Host 'Visual Studio Debug embedded HTML CSS JS and HTTP smoke: PASS'
      - name: Publish Windows x64 portable web app
        shell: pwsh
        run: dotnet publish src/IPSys.Web/IPSys.Web.csproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o artifacts/IPSys-Web-win-x64
      - name: Verify framework-dependent Release runtime prerequisites
        shell: pwsh
        run: |
          $installed = @(dotnet --list-runtimes)
          foreach ($framework in @('Microsoft.WindowsDesktop.App', 'Microsoft.AspNetCore.App')) {
            if (-not ($installed | Where-Object { $_ -match "^$([regex]::Escape($framework)) 8[.]" })) {
              $installed | ForEach-Object { Write-Host $_ }
              throw "Missing .NET 8 framework: $framework"
            }
          }
          Write-Host 'External .NET 8 desktop and ASP.NET Core shared runtimes available: PASS'
      - name: Verify portable Release package contains only one EXE
        shell: pwsh
        run: |
          $folder = 'artifacts/IPSys-Web-win-x64'
          $exe = Join-Path $folder 'IPSys.Web.exe'
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) {
            throw 'Single-file published executable missing'
          }
          $unexpected = @(Get-ChildItem -LiteralPath $folder -Force | Where-Object { $_.Name -ne 'IPSys.Web.exe' })
          if ($unexpected.Count -gt 0) {
            $unexpected | Select-Object Name, FullName, Length | Format-Table -AutoSize
            throw 'Portable publish must contain only IPSys.Web.exe (no runtimes, wwwroot, DLL, JSON or PDB)'
          }
          Write-Host 'Portable single EXE layout: PASS'
      - name: Verify published MCP stdio handshake and tools
        shell: pwsh
        run: |
          $exe = (Resolve-Path '.\artifacts\IPSys-Web-win-x64\IPSys.Web.exe').Path
          $info = [System.Diagnostics.ProcessStartInfo]::new()
          $info.FileName = $exe
          $info.Arguments = '--mcp'
          $info.UseShellExecute = $false
          $info.CreateNoWindow = $true
          $info.RedirectStandardInput = $true
          $info.RedirectStandardOutput = $true
          $info.RedirectStandardError = $true
          $process = [System.Diagnostics.Process]::Start($info)
          try {
            $process.StandardInput.WriteLine('   ')
            $process.StandardInput.WriteLine('{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}')
            $line = $process.StandardOutput.ReadLineAsync().WaitAsync([TimeSpan]::FromSeconds(12)).GetAwaiter().GetResult()
            $initialized = $line | ConvertFrom-Json
            if ($initialized.id -ne 1 -or $initialized.result.serverInfo.name -ne 'ipsys-local') { throw 'MCP initialize response mismatch' }
            if ($initialized.result.protocolVersion -ne '2025-06-18') { throw 'Unexpected MCP protocol version' }
            $process.StandardInput.WriteLine('{"jsonrpc":"2.0","id":99,"method":"initialize","params":{"protocolVersion":"9999-99-99","capabilities":{}}}')
            $versionReply = ($process.StandardOutput.ReadLineAsync().WaitAsync([TimeSpan]::FromSeconds(12)).GetAwaiter().GetResult()) | ConvertFrom-Json
            if ($versionReply.result.protocolVersion -ne '2025-06-18') { throw 'Unsupported protocol version echoed to client' }
            $process.StandardInput.WriteLine('{"jsonrpc":"2.0","id":2,"method":"tools/list"}')
            $line = $process.StandardOutput.ReadLineAsync().WaitAsync([TimeSpan]::FromSeconds(12)).GetAwaiter().GetResult()
            $listing = $line | ConvertFrom-Json
            $names = @($listing.result.tools | ForEach-Object { $_.name })
            if ($names.Count -ne 64) { throw "Expected 64 MCP tools, received $($names.Count)" }
            if (@($names | Where-Object { $_ -like 'v2_*' }).Count -gt 0) {
              throw 'Retired v2_* MCP aliases must not be exposed'
            }
            foreach ($required in @('list_projects','create_project','update_project',
                                    'create_contract','upload_files','delete_project','delete_contract','delete_file',
                                    'list_ips','create_ip','update_ip','delete_ip',
                                    'list_party_archives','create_party_archive',
                                    'update_party_archive','delete_party_archive')) {
              if ($names -notcontains $required) { throw "MCP tool missing: $required" }
            }
            Write-Host 'MCP stdio initialize and tool manifest: PASS'
            # Exercise the actual published stdio tools/call dispatch and schema
            # validation. The GUI host is not running in this separate stage.
            $process.StandardInput.WriteLine('{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"list_files_page","arguments":{"workspace":"company","unexpected_parameter":"reject"}}}')
            $line = $process.StandardOutput.ReadLineAsync().WaitAsync([TimeSpan]::FromSeconds(12)).GetAwaiter().GetResult()
            $validation = $line | ConvertFrom-Json
            if ($validation.id -ne 3 -or $validation.result.isError -ne $true) {
              throw 'MCP stdio tools/call failed to reject unknown input properties'
            }
            $structured = $validation.result.content[0].text | ConvertFrom-Json
            if ($structured.message -notmatch '未声明的 MCP 参数') {
              throw 'MCP stdio error JSON does not identify the rejected parameter'
            }
            if ($structured.ok -ne $false -or $structured.code -ne 'TOOL_CALL_REJECTED' -or
                $structured.retryable -ne $false -or -not $structured.message) {
              throw 'MCP tool error is not a structured JSON envelope'
            }
            $process.StandardInput.WriteLine('[{"jsonrpc":"2.0","id":5,"method":"ping"}]')
            $batch = ($process.StandardOutput.ReadLineAsync().WaitAsync([TimeSpan]::FromSeconds(12)).GetAwaiter().GetResult()) | ConvertFrom-Json
            if ($batch.error.code -ne -32600) { throw 'MCP batch request must return -32600' }
            Write-Host 'MCP stdio tool dispatch, errors, and batch refusal: PASS'
          }
          finally {
            try { $process.StandardInput.Close() } catch {}
            if (-not $process.WaitForExit(3000)) { $process.Kill() }
            $process.Dispose()
          }
      - name: Verify browser JavaScript syntax
        shell: pwsh
        run: |
          $scripts = @(
            'src/IPSys.Web/wwwroot/ip-v2.js',
            'src/IPSys.Web/wwwroot/upload-progress.js',
            'src/IPSys.Web/wwwroot/export.js',
            'src/IPSys.Web/wwwroot/pdf-preview.js',
            'src/IPSys.Web/wwwroot/pdfjs/pdf.min.js',
            'src/IPSys.Web/wwwroot/pdfjs/pdf.worker.min.js',
            'src/IPSys.Web/wwwroot/dist/app.js')
          foreach ($file in $scripts) {
            node --check $file
            if ($LASTEXITCODE -ne 0) { throw "JavaScript syntax failed: $file" }
          }
          Write-Host 'Capability layer, bundled shell and offline PDF.js syntax: PASS'
      - name: Validate native-save evidence verifier syntax
        shell: pwsh
        run: |
          $text = Get-Content -LiteralPath 'tests/tools/Verify-ExplorerExports.ps1' -Raw
          $tokens = $null; $errors = $null
          [System.Management.Automation.Language.Parser]::ParseInput($text,[ref]$tokens,[ref]$errors) | Out-Null
          if (@($errors).Count -ne 0) { $errors | Format-List; throw 'PowerShell evidence verifier syntax failed' }
          Write-Host 'Explorer real-save evidence tool parser: PASS'
          # Exercise the actual verifier on a real filesystem ZIP32 fixture.
          # Large ZIP64 with a real browser picker remains an Agent desktop test.
          $qa = Join-Path $env:RUNNER_TEMP 'ipsys-export-audit-fixture'
          New-Item -ItemType Directory -Force -Path $qa | Out-Null
          $original = Join-Path $qa 'original.bin'
          [System.IO.File]::WriteAllBytes($original, [byte[]](0..255))
          $saved = Join-Path $qa 'qa-saved.zip'
          $stream = [System.IO.File]::Create($saved)
          try {
            $archive = [System.IO.Compression.ZipArchive]::new(
              $stream,[System.IO.Compression.ZipArchiveMode]::Create,$true)
            try {
              $entry = $archive.CreateEntry('项目QA/原件.bin')
              $entryStream = $entry.Open()
              try {
                $payload = [System.IO.File]::ReadAllBytes($original)
                $entryStream.Write($payload,0,$payload.Length)
              } finally { $entryStream.Dispose() }
            } finally { $archive.Dispose() }
          } finally { $stream.Dispose() }
          $manifest = Join-Path $qa 'manifest.json'
          @{zipPath=$saved;requireZip64=$false;files=@(
            @{sourcePath=$original;zipEntry='项目QA/原件.bin'}
          )} | ConvertTo-Json -Depth 7 | Set-Content -LiteralPath $manifest -Encoding utf8
          pwsh -NoProfile -File tests/tools/Verify-ExplorerExports.ps1 -Manifest $manifest -EvidenceDirectory $qa
          if ($LASTEXITCODE -ne 0) { throw 'Real ZIP32 audit fixture unexpectedly failed' }
          $proof = Get-Content (Join-Path $qa 'explorer-export-audit.json') -Raw | ConvertFrom-Json
          if ($proof.result -ne 'PASS' -or $proof.files.Count -ne 1 -or
              $proof.files[0].shaMatch -ne $true) {
            throw 'Audit fixture did not verify ZIP entry bytes and SHA-256'
          }
          Write-Host 'Saved-file ZIP audit with real disk bytes: PASS'
      - name: Verify UI and capability smoke tests
        shell: pwsh
        run: |
          # Ordered on purpose: ui-assets-smoke asserts that dist/ matches a fresh
          # bundle of the sources, so it must run before anything reads dist/.
          $tests = [ordered]@{
            'ui-assets-smoke.cjs'              = 'Shell asset contract (load order, bridge globals, fresh bundle) failed'
            'storage-usage-smoke.cjs'           = 'Whole-vault page usage API and shared UI contract failed'
            'ui-tree-smoke.cjs'                = 'Drive tree (project / contract / original) smoke failed'
            'explorer-p0-interactions-smoke.cjs' = 'Explorer P0 deletion and lock regression failed'
            'explorer-p1-regression-smoke.cjs' = 'Explorer P1 archive ordering and API error handling regression failed'
            'explorer-p2-interactions-smoke.cjs' = 'Explorer P2 safe recycle batching and UI regression failed'
            'explorer-vault-create-smoke.cjs' = 'Explorer new-vault entry and safe session resume failed'
            'explorer-session-expiry-smoke.cjs' = 'Explorer D-01 runtime 401 recovery regression failed'
            'explorer-archive-operations-smoke.cjs' = 'Explorer F2-02 archive directory actions and mixed reorder regression failed'
            'explorer-file-associate-smoke.cjs' = 'Explorer F2-03 same-workspace file share and move regression failed'
            'explorer-record-transfer-smoke.cjs' = 'Explorer F2-04 whole-record copy/move/transfer regression failed'
            'explorer-internal-dragdrop-smoke.cjs' = 'Explorer F2-05 internal drag/drop and duplicate-upload regression failed'
            'explorer-pending-upload-smoke.cjs' = 'Explorer D-05 pending-original recovery regression failed'
            'explorer-f2-final-consistency-smoke.cjs' = 'Explorer F2-06 menu/toolbar/detail/selection and state consistency regression failed'
            'explorer-capabilities-smoke.cjs'  = 'Streaming download / server search / purge progress failed'
            'excel-scope-smoke.cjs'           = 'Excel all/filtered export choice, workspace and contract summary regression failed'
            'upload-progress-smoke.cjs'        = 'Real upload progress/multiphase state smoke failed'
            'upload-unique-autosave-smoke.cjs' = 'Unique original auto-save and duplicate confirmation smoke failed'
            'export-smoke.cjs'                 = 'Directory/ZIP export smoke failed'
            'zip64-smoke.cjs'                  = 'ZIP64 large-offset header smoke failed'
            'pdf-canvas-smoke.cjs'             = 'PDF canvas rendering/zoom/pagination test failed'
          }
          foreach ($name in $tests.Keys) {
            node "src/IPSys.Web/tests/$name"
            if ($LASTEXITCODE -ne 0) { throw $tests[$name] }
          }
          Write-Host 'All web smoke tests: PASS'
      - name: Run corrected Explorer V2 HTTP and Edge retest
        shell: pwsh
        env:
          IPSYS_RETEST_RUN_ID: v2ci-${{ github.run_id }}-${{ github.run_attempt }}
          IPSYS_EVIDENCE_DIR: tests/retest-v2-2026-10-22/evidence/runs/v2ci-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path $PWD 'src/IPSys.Web/bin/Debug/net8.0-windows/IPSys.Web.exe'
          $evidence = Join-Path $PWD $env:IPSYS_EVIDENCE_DIR
          New-Item -ItemType Directory -Path $evidence -Force | Out-Null
          $hostOut = Join-Path $env:RUNNER_TEMP "ipsys-host-$env:IPSYS_RETEST_RUN_ID.out.log"
          $hostErr = Join-Path $env:RUNNER_TEMP "ipsys-host-$env:IPSYS_RETEST_RUN_ID.err.log"
          $hostProc = $null
          try {
            if (-not (Test-Path -LiteralPath $exe)) { throw "Debug host EXE missing: $exe" }
            $hostProc = Start-Process -FilePath $exe -PassThru -WorkingDirectory $PWD -WindowStyle Hidden -RedirectStandardOutput $hostOut -RedirectStandardError $hostErr
            $base = $null
            $deadline = [DateTime]::UtcNow.AddSeconds(45)
            while ([DateTime]::UtcNow -lt $deadline -and -not $base) {
              if ($hostProc.HasExited) {
                $out = if (Test-Path $hostOut) { Get-Content $hostOut -Raw } else { '' }
                $err = if (Test-Path $hostErr) { Get-Content $hostErr -Raw } else { '' }
                throw "IPSys host exited early ($($hostProc.ExitCode)). STDOUT=$out STDERR=$err"
              }
              $listeners = @(Get-NetTCPConnection -State Listen -OwningProcess $hostProc.Id -ErrorAction SilentlyContinue |
                Where-Object { $_.LocalAddress -eq '127.0.0.1' -and $_.LocalPort -gt 0 })
              foreach ($listener in $listeners) {
                $candidate = "http://127.0.0.1:$($listener.LocalPort)"
                try {
                  $response = Invoke-WebRequest -Uri "$candidate/" -UseBasicParsing -TimeoutSec 2
                  if ($response.StatusCode -eq 200) { $base = $candidate; break }
                } catch {}
              }
              if (-not $base -and (Test-Path $hostOut)) {
                $hostLog = Get-Content $hostOut -Raw
                if ($hostLog -match 'http://127\.0\.0\.1:(\d+)') {
                  $candidate = "http://127.0.0.1:$($Matches[1])"
                  try {
                    $response = Invoke-WebRequest -Uri "$candidate/" -UseBasicParsing -TimeoutSec 2
                    if ($response.StatusCode -eq 200) { $base = $candidate }
                  } catch {}
                }
              }
              if (-not $base) { Start-Sleep -Milliseconds 250 }
            }
            if (-not $base) {
              $out = if (Test-Path $hostOut) { Get-Content $hostOut -Raw } else { '' }
              $err = if (Test-Path $hostErr) { Get-Content $hostErr -Raw } else { '' }
              throw "Timed out waiting for loopback host. STDOUT=$out STDERR=$err"
            }
            Write-Host "Isolated test host ready: $base"
            $env:IPSYS_BASE = $base
            node tests/retest-v2-2026-10-22/scripts/fixture.cjs $env:IPSYS_RETEST_RUN_ID
            if ($LASTEXITCODE -ne 0) { throw 'Disposable V2 fixture setup failed' }
            node tests/retest-v2-2026-10-22/scripts/t-http.cjs $env:IPSYS_RETEST_RUN_ID
            if ($LASTEXITCODE -ne 0) { throw 'V2 HTTP retest failed before writing its result JSON' }
            node tests/retest-v2-2026-10-22/scripts/t-browser.cjs $env:IPSYS_RETEST_RUN_ID
            if ($LASTEXITCODE -ne 0) { throw 'V2 Edge retest failed before writing its result JSON' }
            $env:IPSYS_CASES_OUTPUT = Join-Path $evidence 'IPSys_Explorer_Full_Retest_V2_Cases.csv'
            python tests/retest-v2-2026-10-22/scripts/gen-cases.py
            if ($LASTEXITCODE -ne 0) { throw 'V2 run-specific case CSV generation failed' }
            foreach ($name in @('http-results.json', 'browser-results.json')) {
              $resultPath = Join-Path $evidence $name
              if (-not (Test-Path -LiteralPath $resultPath)) { throw "Missing test results: $resultPath" }
              $items = @(Get-Content -LiteralPath $resultPath -Raw | ConvertFrom-Json)
              Write-Host "=== $name ($($items.Count) results) ==="
              $items | Group-Object result | Sort-Object Name | ForEach-Object { Write-Host "$($_.Name)=$($_.Count)" }
            }
          }
          finally {
            if ($hostProc -and -not $hostProc.HasExited) {
              Stop-Process -Id $hostProc.Id -Force -ErrorAction SilentlyContinue
            }
            Start-Sleep -Milliseconds 300
            if (Test-Path $hostOut) { Copy-Item -LiteralPath $hostOut -Destination (Join-Path $evidence 'host-stdout.log') -Force }
            if (Test-Path $hostErr) { Copy-Item -LiteralPath $hostErr -Destination (Join-Path $evidence 'host-stderr.log') -Force }
          }
      - name: Verify SQLCipher and local HTTP roundtrip
        shell: pwsh
        env:
          IPSYS_LARGE_FILE_SMOKE: ${{ ((github.event_name == 'workflow_dispatch' && inputs.large_file_smoke) || contains(github.event.head_commit.message, '[large-file-test]')) && '1' || '0' }}
        run: |
          $report = Join-Path $env:RUNNER_TEMP 'ipsys-web-smoke.txt'
          $env:IPSYS_SMOKE_REPORT = $report
          $exe = (Resolve-Path '.\artifacts\IPSys-Web-win-x64\IPSys.Web.exe').Path
          $proc = Start-Process -FilePath $exe -ArgumentList '--smoke' -PassThru -Wait
          if ($proc.ExitCode -ne 0) {
            if (Test-Path $report) { Write-Host (Get-Content $report -Raw) }
            throw "WinExe smoke failed (exit $($proc.ExitCode))"
          }
          if (-not (Test-Path $report)) { throw "Smoke completion report missing" }
          if ((Get-Content $report -Raw) -notmatch 'WEB SMOKE PASS') { throw "Smoke assertions incomplete" }
          Write-Host "WEB SMOKE PASS (WinExe process finished; report verified)"
      - name: Publish self-contained Windows x64 single EXE
        shell: pwsh
        run: |
          # Unlike the framework-dependent EXE, this bundles the .NET 8 runtime.
          dotnet publish src/IPSys.Web/IPSys.Web.csproj -c Release -r win-x64 --self-contained true -p:SelfContained=true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o artifacts/IPSys-Web-win-x64-self-contained
          if ($LASTEXITCODE -ne 0) { throw 'Self-contained Release publish failed' }
      - name: Verify both single-file deployment modes
        shell: pwsh
        run: |
          $frameworkDir = 'artifacts/IPSys-Web-win-x64'
          $selfContainedDir = 'artifacts/IPSys-Web-win-x64-self-contained'
          foreach ($folder in @($frameworkDir,$selfContainedDir)) {
            $exe = Join-Path $folder 'IPSys.Web.exe'
            if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) {
              throw "Missing EXE: $exe"
            }
            $unexpected = @(Get-ChildItem -LiteralPath $folder -Force | Where-Object { $_.Name -ne 'IPSys.Web.exe' })
            if ($unexpected.Count -ne 0) {
              $unexpected | Select-Object Name,Length | Format-Table -AutoSize
              throw "Expected one EXE and no sidecars: $folder"
            }
          }
          $frameworkBytes = (Get-Item (Join-Path $frameworkDir 'IPSys.Web.exe')).Length
          $selfContainedBytes = (Get-Item (Join-Path $selfContainedDir 'IPSys.Web.exe')).Length
          if ($selfContainedBytes -le $frameworkBytes) {
            throw "The self-contained binary is not larger than the framework-dependent binary: $selfContainedBytes <= $frameworkBytes. Verify SelfContained=true."
          }
          Write-Host "Framework-dependent: $frameworkBytes bytes; self-contained: $selfContainedBytes bytes"
          # Verify the actual filenames users download from GitHub Releases also run.
          foreach ($variant in @(
            @{source=(Join-Path $frameworkDir 'IPSys.Web.exe'); name='IPSys-win-x64-FrameworkDependent.exe'; mode='framework-dependent'},
            @{source=(Join-Path $selfContainedDir 'IPSys.Web.exe'); name='IPSys-win-x64-SelfContained.exe'; mode='self-contained'}
          )) {
            $candidate = Join-Path $env:RUNNER_TEMP $variant.name
            Copy-Item -LiteralPath $variant.source -Destination $candidate -Force
            $report = Join-Path $env:RUNNER_TEMP ("ipsys-release-" + $variant.mode + ".txt")
            $env:IPSYS_SMOKE_REPORT = $report
            $proc = Start-Process -FilePath $candidate -ArgumentList '--smoke' -PassThru -Wait
            if ($proc.ExitCode -ne 0) {
              if (Test-Path -LiteralPath $report) { Write-Host (Get-Content -LiteralPath $report -Raw) }
              throw "Release-named $($variant.mode) EXE smoke failed (exit $($proc.ExitCode))"
            }
            if (-not (Test-Path -LiteralPath $report) -or
                (Get-Content -LiteralPath $report -Raw) -notmatch 'WEB SMOKE PASS') {
              throw "Release-named $($variant.mode) EXE did not report WEB SMOKE PASS"
            }
            Remove-Item -LiteralPath $candidate -Force
            Write-Host "Release-named $($variant.mode) EXE HTTP/SQLCipher smoke: PASS"
          }
      - name: Verify embedded application icon in both published EXEs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName System.Drawing.Common
          $source = (Resolve-Path 'src/IPSys.Web/assets/IPSys.ico').Path
          $expectedIcon = [System.Drawing.Icon]::new($source,32,32)
          $expectedBmp = $expectedIcon.ToBitmap()
          try {
            foreach ($exe in @(
              'src/IPSys.Web/bin/Debug/net8.0-windows/IPSys.Web.exe',
              'artifacts/IPSys-Web-win-x64/IPSys.Web.exe',
              'artifacts/IPSys-Web-win-x64-self-contained/IPSys.Web.exe'
            )) {
              $actualIcon = [System.Drawing.Icon]::ExtractAssociatedIcon((Resolve-Path $exe).Path)
              if ($null -eq $actualIcon) { throw "Missing executable icon: $exe" }
              $actualBmp = $actualIcon.ToBitmap()
              try {
                if ($actualBmp.Width -ne 32 -or $actualBmp.Height -ne 32) {
                  throw "Unexpected EXE icon resolution: $exe ($($actualBmp.Width)x$($actualBmp.Height))"
                }
                $tested = 0; $matched = 0
                for ($y = 0; $y -lt 32; $y++) {
                  for ($x = 0; $x -lt 32; $x++) {
                    $a = $expectedBmp.GetPixel($x,$y)
                    if ($a.A -lt 180) { continue }
                    $b = $actualBmp.GetPixel($x,$y)
                    $tested++
                    if ([math]::Abs([int]$a.R - [int]$b.R) -le 28 -and
                        [math]::Abs([int]$a.G - [int]$b.G) -le 28 -and
                        [math]::Abs([int]$a.B - [int]$b.B) -le 28) {
                      $matched++
                    }
                  }
                }
                if ($tested -lt 500 -or $matched -lt [math]::Ceiling($tested * 0.9)) {
                  throw "EXE icon does not match IPSys.ico: $exe ($matched/$tested matched)"
                }
                Write-Host "Windows PE icon matches IPSys.ico: $exe ($matched/$tested pixels)"
              } finally { $actualBmp.Dispose(); $actualIcon.Dispose() }
            }
          } finally { $expectedBmp.Dispose(); $expectedIcon.Dispose() }
      - name: Upload self-contained Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: IPSys-Web-win-x64-self-contained
          path: artifacts/IPSys-Web-win-x64-self-contained/IPSys.Web.exe
          if-no-files-found: error
      - name: Generate physical ZIP64 archive above 4 GiB (generation only)
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.zip64_file_smoke) || contains(github.event.head_commit.message, '[zip64-real-test]') }}
        shell: pwsh
        env:
          IPSYS_ZIP64_OUTPUT_DIR: ${{ runner.temp }}/ipsys-real-zip64
        run: |
          $ErrorActionPreference = 'Stop'
          node src/IPSys.Web/tests/zip64-real-generate.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Production ZIP64 physical generation failed' }
          $report = Join-Path $env:IPSYS_ZIP64_OUTPUT_DIR 'zip64-generation-evidence.json'
          $evidence = Get-Content -LiteralPath $report -Raw | ConvertFrom-Json
          if ($evidence.result -ne 'PASS_GENERATION_ONLY' -or
              [long]$evidence.bytes -le 4294967295 -or
              $evidence.fileCount -ne 2 -or
              -not $evidence.zip64EocdFound -or
              -not $evidence.zip64LocatorFound) {
            throw 'Physical ZIP64 archive evidence incomplete'
          }
          Write-Host "ZIP64 generation-only result: $($evidence.bytes) bytes, SHA256 $($evidence.zipSha256)"
          # Do not upload multi-GiB archives to GitHub or leave huge temporary
          # files on the ephemeral CI runner. A local run keeps the archive.
          Remove-Item -LiteralPath $evidence.actualFile -Force
      - name: Upload ZIP64 generation metadata only
        if: ${{ always() && ((github.event_name == 'workflow_dispatch' && inputs.zip64_file_smoke) || contains(github.event.head_commit.message, '[zip64-real-test]')) }}
        uses: actions/upload-artifact@v4
        with:
          name: IPSys-ZIP64-generation-${{ github.run_id }}
          path: ${{ runner.temp }}/ipsys-real-zip64/zip64-generation-evidence.json
          if-no-files-found: warn
      - name: Upload Windows executable with embedded web assets
        uses: actions/upload-artifact@v4
        with:
          name: IPSys-Web-win-x64
          path: artifacts/IPSys-Web-win-x64/IPSys.Web.exe
          if-no-files-found: error
      - name: Upload isolated Explorer V2 retest evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: IPSys-Explorer-V2-Retest-${{ github.run_id }}-${{ github.run_attempt }}
          path: tests/retest-v2-2026-10-22/evidence/runs/v2ci-${{ github.run_id }}-${{ github.run_attempt }}/**
          if-no-files-found: warn
          retention-days: 30